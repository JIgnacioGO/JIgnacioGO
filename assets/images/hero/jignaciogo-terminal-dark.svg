<svg xmlns="http://www.w3.org/2000/svg" width="900" height="90" viewBox="0 0 900 90" role="img" aria-label="JIgnacioGO_">
  <style>
    .title {
      fill: #E6EDF3;
      font-family: "Fira Code", "JetBrains Mono", Consolas, monospace;
      font-size: 42px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .cursor {
      animation: blink 1s steps(1, end) infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <text x="50%" y="50%" class="title">
    <tspan>JIgnacioGO</tspan><tspan class="cursor">_</tspan>
  </text>
</svg>
